name: Build and Release

on:
  # 允许手动触发 (这是让你能看到 "Run workflow" 按钮的关键)
  workflow_dispatch:
  
  # 当推送到 main 分支时自动触发
  push:
    branches: [ "main" ]
    # 当推送 v 开头的 tag 时触发 (例如 v4.7.0) 自动发版
    tags: [ "v*" ]

jobs:
  # 任务 1: 构建二进制文件
  build-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予发布 Release 的权限
    steps:
      - name: Checkout code
        # [修复] 升级到 v4
        uses: actions/checkout@v4

      - name: Setup Node.js
        # [修复] 升级到 v4
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Binaries (pkg)
        run: npm run build

      - name: Upload Artifacts
        # [修复] 必须升级到 v4，v3 已被废弃
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          # v4 默认不压缩为 zip，如果需要 zip 可以把 path 改具体点，或者保持原样

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        # [建议] 推荐升级到 v2
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 任务 2: 构建 Docker 镜像 (可选，只有打 Tag 时运行)
  build-docker:
    runs-on: ubuntu-latest
    needs: build-binary
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 仅测试构建，不推送。如果需要推送请参考之前的配置添加登录步骤
      - name: Build Docker Image
        run: docker build . --file Dockerfile --tag workers:latest