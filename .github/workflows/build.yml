name: Push Docker (Hub & GHCR)

on:
  # 1. 自动触发：推送到 main 分支或打 tag
  push:
    branches:
      - "main"
    tags:
      - "v*"
  # 2. 手动触发
  workflow_dispatch:
    inputs:
      tag_name:
        description: '手动构建的 Tag (例如 v1.0.1)'
        required: false
        default: 'manual-latest'

env:
  # Docker Hub 镜像名 (格式: 用户名/workers)
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/workers
  # GHCR 镜像名 (格式: ghcr.io/用户名/workers)
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必须有权限写入 GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 QEMU 以支持多架构构建 (x86 和 arm)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 1. 登录 Docker Hub ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- 2. 登录 GitHub Container Registry ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. 生成标签 (自动处理两个仓库) ---
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            # 自动处理 v1.0.0
            type=semver,pattern={{version}}
            # main 分支对应 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # 手动触发使用输入的 tag
            type=raw,value=${{ inputs.tag_name }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # --- 4. 构建并推送 ---
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 同时构建 AMD64 和 ARM64 架构
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
