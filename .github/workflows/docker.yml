name: 构建docker镜像

on:
  # 1. 允许手动触发构建 (Manual Trigger)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for image (optional, e.g., v1.0.1)'
        required: false
        default: 'v1.0.0'
  
  # 2. 推送 v* 标签时触发 (如 v1.0.0)
  push:
    tags:
      - 'v*'
    branches:
      - main

env:
  # Docker Hub 镜像名 (请确保 secrets.DOCKER_USERNAME 已设置)
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/workers
  # GitHub Container Registry 镜像名 (自动获取仓库名)
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/workers

jobs:
  build-docker:
    runs-on: ubuntu-latest
    # 授予写入 GitHub Packages 的权限
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 登录 Docker Hub ---
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- 登录 GitHub Container Registry (GHCR) ---
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 生成元数据 (自动处理 Docker Hub 和 GHCR 的标签) ---
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 这里列出两个镜像地址，它会自动生成对应的 tags
          images: |
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            # 自动处理语义化版本 v1.0.0
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # main 分支推送到 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # 手动触发时，使用输入的 tag 或默认值
            type=raw,value=${{ inputs.tag_name }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # --- 构建并推送 (同时推送到两个仓库) ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # 支持多架构 (AMD64 和 ARM64)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
